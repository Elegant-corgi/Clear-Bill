# Runtime mode: debug / test / release
RunMode = "debug"

# Static website directory served by the backend
WWW = "website"

# Print resolved configuration on startup
PrintConfig = false

[HTTP]
# Bind address
Host = "0.0.0.0"

# Bind port
Port = 8080

# Request header timeout in seconds
ServeTimeout = 5

# Graceful shutdown timeout in seconds
ShutdownTimeout = 5

[GORM]
Host = "127.0.0.1"
Port = 3306
Database = "clear_bill"
User = "root"
Password = "root"
Charset = "utf8mb4"
ParseTime = true
Loc = "Local"
MaxIdleConns = 10
MaxOpenConns = 50
ConnMaxLifetime = 300
