basePath: /api/v1
definitions:
  clearbill_mgr_server_api_vo.ChangeOwnPasswordReq:
    properties:
      newPassword:
        maxLength: 128
        minLength: 6
        type: string
      oldPassword:
        maxLength: 128
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  clearbill_mgr_server_api_vo.CreateAPITokenReq:
    properties:
      name:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  clearbill_mgr_server_api_vo.CreateCredentialReq:
    properties:
      name:
        maxLength: 128
        type: string
      type:
        maxLength: 16
        type: string
    required:
    - name
    - type
    type: object
  clearbill_mgr_server_api_vo.CreateRoleReq:
    properties:
      code:
        maxLength: 64
        type: string
      name:
        maxLength: 128
        type: string
      permissionIds:
        items:
          type: string
        type: array
      scope:
        maxLength: 16
        type: string
      tenantId:
        type: integer
    required:
    - code
    - name
    type: object
  clearbill_mgr_server_api_vo.CreateTenantReq:
    properties:
      adminDisplayName:
        maxLength: 128
        type: string
      adminUsername:
        maxLength: 64
        type: string
      code:
        maxLength: 64
        type: string
      contactName:
        maxLength: 64
        type: string
      contactPhone:
        maxLength: 32
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        maxLength: 32
        type: string
    required:
    - code
    - name
    type: object
  clearbill_mgr_server_api_vo.CreateUserReq:
    properties:
      displayName:
        maxLength: 128
        type: string
      role:
        maxLength: 64
        type: string
      status:
        maxLength: 32
        type: string
      tenantId:
        type: integer
      username:
        maxLength: 64
        type: string
    required:
    - displayName
    - role
    - username
    type: object
  clearbill_mgr_server_api_vo.LoginReq:
    properties:
      password:
        maxLength: 128
        type: string
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  clearbill_mgr_server_api_vo.ResetPasswordReq:
    properties:
      newPassword:
        maxLength: 128
        minLength: 6
        type: string
    required:
    - newPassword
    type: object
  clearbill_mgr_server_api_vo.ResponseResult:
    properties:
      data: {}
      error:
        type: string
      errorMessage:
        type: string
      success:
        type: boolean
    type: object
  clearbill_mgr_server_api_vo.RotateCredentialReq:
    properties:
      name:
        maxLength: 128
        type: string
    type: object
  clearbill_mgr_server_api_vo.UpdateRolePermissionsReq:
    properties:
      permissionIds:
        items:
          type: string
        type: array
    type: object
  clearbill_mgr_server_api_vo.UpdateRoleReq:
    properties:
      name:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  clearbill_mgr_server_api_vo.UpdateTenantReq:
    properties:
      code:
        maxLength: 64
        type: string
      contactName:
        maxLength: 64
        type: string
      contactPhone:
        maxLength: 32
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        maxLength: 32
        type: string
    required:
    - code
    - name
    type: object
  clearbill_mgr_server_api_vo.UpdateUserReq:
    properties:
      displayName:
        maxLength: 128
        type: string
      role:
        maxLength: 64
        type: string
      status:
        maxLength: 32
        type: string
      tenantId:
        type: integer
    required:
    - displayName
    - role
    type: object
info:
  contact: {}
  description: Clear Bill backend service API.
  title: Clear Bill API
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，设置后台 session
      operationId: auth-login
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 用户登录
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 清除当前后台 session
      operationId: auth-logout
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 用户登出
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: 返回当前登录用户信息
      operationId: auth-me
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 当前用户信息
      tags:
      - auth
  /api/v1/auth/password:
    put:
      consumes:
      - application/json
      description: 当前登录用户修改自己的密码
      operationId: auth-password-change
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.ChangeOwnPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 修改自己的密码
      tags:
      - auth
  /api/v1/auth/tokens:
    post:
      consumes:
      - application/json
      description: 为当前已登录用户签发一个用于外部 API 调用的 token
      operationId: auth-token-create
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.CreateAPITokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 创建 API token
      tags:
      - auth
  /api/v1/bills:
    get:
      description: 返回账单列表数据
      operationId: bills-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询账单列表
      tags:
      - billing
  /api/v1/credentials:
    get:
      description: 查询当前用户可见的凭证，系统管理员可查看全部
      operationId: credentials-list
      parameters:
      - description: 凭证类型
        in: query
        name: type
        type: string
      - description: 凭证状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询凭证列表
      tags:
      - credential
    post:
      consumes:
      - application/json
      description: 为当前登录用户创建 AK/SK 或 token 凭证
      operationId: credentials-create
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.CreateCredentialReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 创建凭证
      tags:
      - credential
  /api/v1/credentials/{id}:
    delete:
      description: 删除指定凭证
      operationId: credentials-delete
      parameters:
      - description: 凭证ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 删除凭证
      tags:
      - credential
    get:
      description: 查询指定凭证的元数据，不返回密钥明文
      operationId: credentials-get
      parameters:
      - description: 凭证ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询凭证详情
      tags:
      - credential
  /api/v1/credentials/{id}/rotate:
    post:
      consumes:
      - application/json
      description: 将旧凭证置为已轮转并生成一条新的凭证记录
      operationId: credentials-rotate
      parameters:
      - description: 凭证ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.RotateCredentialReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 轮转凭证
      tags:
      - credential
  /api/v1/customers:
    get:
      description: 返回客户列表数据
      operationId: customers-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询客户列表
      tags:
      - billing
  /api/v1/dashboard/summary:
    get:
      description: 返回账单工作台概览数据
      operationId: dashboard-summary-get
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询仪表盘概览
      tags:
      - billing
  /api/v1/health:
    get:
      description: 返回服务健康状态与版本信息
      operationId: health-get
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 健康检查
      tags:
      - system
  /api/v1/permissions:
    get:
      description: 返回基于 Swagger 接口注解生成的权限列表
      operationId: permissions-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询权限列表
      tags:
      - role
  /api/v1/reconciliations:
    get:
      description: 返回对账任务列表数据
      operationId: reconciliations-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询对账任务列表
      tags:
      - billing
  /api/v1/roles:
    get:
      description: 查询可见范围内的角色列表
      operationId: roles-list
      parameters:
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 角色作用域
        in: query
        name: scope
        type: string
      - description: 租户ID
        in: query
        name: tenantId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询角色列表
      tags:
      - role
    post:
      consumes:
      - application/json
      description: 创建角色并分配权限
      operationId: roles-create
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.CreateRoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 创建角色
      tags:
      - role
  /api/v1/roles/{id}:
    delete:
      description: 删除指定角色
      operationId: roles-delete
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 删除角色
      tags:
      - role
    get:
      description: 查询指定角色信息
      operationId: roles-get
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询角色详情
      tags:
      - role
    put:
      consumes:
      - application/json
      description: 更新指定角色的基础信息
      operationId: roles-update
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.UpdateRoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 更新角色
      tags:
      - role
  /api/v1/roles/{id}/permissions:
    put:
      consumes:
      - application/json
      description: 覆盖指定角色的权限列表
      operationId: roles-permissions-update
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.UpdateRolePermissionsReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 更新角色权限
      tags:
      - role
  /api/v1/tenants:
    get:
      description: 根据关键字查询租户列表
      operationId: tenants-list
      parameters:
      - description: 关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询租户列表
      tags:
      - tenant
    post:
      consumes:
      - application/json
      description: 创建一条新的租户记录
      operationId: tenants-create
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.CreateTenantReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 创建租户
      tags:
      - tenant
  /api/v1/tenants/{id}:
    delete:
      description: 根据租户ID删除租户
      operationId: tenants-delete
      parameters:
      - description: 租户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 删除租户
      tags:
      - tenant
    get:
      description: 根据租户ID查询租户详情
      operationId: tenants-get
      parameters:
      - description: 租户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询租户详情
      tags:
      - tenant
    put:
      consumes:
      - application/json
      description: 根据租户ID更新租户信息
      operationId: tenants-update
      parameters:
      - description: 租户ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.UpdateTenantReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 更新租户
      tags:
      - tenant
  /api/v1/users:
    get:
      description: 超管可查询所有用户，租户管理员仅可查询本租户用户
      operationId: users-list
      parameters:
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 租户ID
        in: query
        name: tenantId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询用户列表
      tags:
      - user
    post:
      consumes:
      - application/json
      description: 仅超管和租户管理员可创建用户，默认密码为 stor123;
      operationId: users-create
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.CreateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 创建用户
      tags:
      - user
  /api/v1/users/{id}:
    delete:
      description: 删除指定用户
      operationId: users-delete
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 删除用户
      tags:
      - user
    get:
      description: 查询指定用户详情
      operationId: users-get
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询用户详情
      tags:
      - user
    put:
      consumes:
      - application/json
      description: 更新指定用户信息
      operationId: users-update
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 更新用户
      tags:
      - user
  /api/v1/users/{id}/password:
    put:
      consumes:
      - application/json
      description: 超管可修改所有用户密码，租户管理员可修改本租户所有用户密码
      operationId: users-password-reset
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 重置用户密码
      tags:
      - user
swagger: "2.0"
