basePath: /api/v1
definitions:
  clearbill_mgr_server_api_vo.CreateTenantReq:
    properties:
      code:
        maxLength: 64
        type: string
      contactName:
        maxLength: 64
        type: string
      contactPhone:
        maxLength: 32
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        maxLength: 32
        type: string
    required:
    - code
    - name
    type: object
  clearbill_mgr_server_api_vo.ResponseResult:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  clearbill_mgr_server_api_vo.UpdateTenantReq:
    properties:
      code:
        maxLength: 64
        type: string
      contactName:
        maxLength: 64
        type: string
      contactPhone:
        maxLength: 32
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      status:
        maxLength: 32
        type: string
    required:
    - code
    - name
    type: object
info:
  contact: {}
  description: Clear Bill backend service API.
  title: Clear Bill API
  version: 0.1.0
paths:
  /api/v1/bills:
    get:
      description: 返回账单列表数据
      operationId: bills-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询账单列表
      tags:
      - billing
  /api/v1/customers:
    get:
      description: 返回客户列表数据
      operationId: customers-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询客户列表
      tags:
      - billing
  /api/v1/dashboard/summary:
    get:
      description: 返回账单工作台概览数据
      operationId: dashboard-summary-get
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询仪表盘概览
      tags:
      - billing
  /api/v1/health:
    get:
      description: 返回服务健康状态与版本信息
      operationId: health-get
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 健康检查
      tags:
      - system
  /api/v1/reconciliations:
    get:
      description: 返回对账任务列表数据
      operationId: reconciliations-list
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询对账任务列表
      tags:
      - billing
  /api/v1/tenants:
    get:
      description: 根据关键字查询租户列表
      operationId: tenants-list
      parameters:
      - description: 关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询租户列表
      tags:
      - tenant
    post:
      consumes:
      - application/json
      description: 创建一条新的租户记录
      operationId: tenants-create
      parameters:
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.CreateTenantReq'
      produces:
      - application/json
      responses:
        "201":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 创建租户
      tags:
      - tenant
  /api/v1/tenants/{id}:
    delete:
      description: 根据租户ID删除租户
      operationId: tenants-delete
      parameters:
      - description: 租户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 删除租户
      tags:
      - tenant
    get:
      description: 根据租户ID查询租户详情
      operationId: tenants-get
      parameters:
      - description: 租户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 查询租户详情
      tags:
      - tenant
    put:
      consumes:
      - application/json
      description: 根据租户ID更新租户信息
      operationId: tenants-update
      parameters:
      - description: 租户ID
        in: path
        name: id
        required: true
        type: integer
      - description: body参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clearbill_mgr_server_api_vo.UpdateTenantReq'
      produces:
      - application/json
      responses:
        "200":
          description: 执行成功
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
        "404":
          description: 租户不存在
          schema:
            $ref: '#/definitions/clearbill_mgr_server_api_vo.ResponseResult'
      summary: 更新租户
      tags:
      - tenant
swagger: "2.0"
